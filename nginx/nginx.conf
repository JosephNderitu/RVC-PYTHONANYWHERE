# nginx/nginx.conf
# ================================================================
# RiftValley Carriers — Nginx reverse proxy
# ================================================================
# Responsibilities:
#   /static/   → serve directly from staticfiles volume (fast)
#   /media/    → serve directly from media volume
#   /sw.js     → proxy to Django (template rendering required)
#   /manifest.json → proxy to Django ({% static %} tags)
#   /offline/  → proxy to Django
#   everything else → proxy to Django (port 8000)
# ================================================================

upstream django {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;   # allow photo uploads (PoC feature)

    # ── Gzip compression ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Service Worker — MUST have correct headers ───────────────
    # SW scope depends on the Content-Type and Service-Worker-Allowed header
    location = /sw.js {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Critical: allow SW to control the full site scope
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ── Manifest — short cache, must revalidate ──────────────────
    location = /manifest.json {
        proxy_pass       http://django;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";  # 1 day
    }

    # ── Firebase SW — also no-cache ──────────────────────────────
    location = /firebase-messaging-sw.js {
        proxy_pass       http://django;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ── Static files — long cache (WhiteNoise hashes filenames) ──
    location /static/ {
        alias      /app/staticfiles/;
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Fallback: if collectstatic hasn't run, proxy to Django
        try_files $uri @django_fallback;
    }

    # ── Media files (user uploads, proof photos) ──────────────────
    location /media/ {
        alias      /app/media/;
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Everything else → Django ───────────────────────────────────
    location / {
        proxy_pass          http://django;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";

        # WebSocket support (for future real-time features)
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ── Fallback for /static/ if collectstatic hasn't run ─────────
    location @django_fallback {
        proxy_pass       http://django;
        proxy_set_header Host $host;
    }
}