{% extends 'base.html' %}
{% block title %}Password Reset Complete — RiftValley Carriers{% endblock %}
{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&display=swap');
*{box-sizing:border-box;}
.auth-bg{min-height:100vh;background:#F8FAFC;display:flex;align-items:center;justify-content:center;padding:32px 16px;font-family:'Inter',sans-serif;}
.auth-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 4px 6px rgba(0,0,0,.04),0 20px 60px rgba(13,27,62,.10);text-align:center;}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;text-decoration:none;}
.brand-icon{width:40px;height:40px;background:#0D1B3E;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#F97316;font-size:18px;}
.brand-name{font-family:'Sora',sans-serif;font-size:1rem;font-weight:800;color:#0D1B3E;}
.success-circle{width:72px;height:72px;background:#DCFCE7;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#16A34A;font-size:28px;margin:0 auto 22px;animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(0.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.auth-title{font-family:'Sora',sans-serif;font-size:1.45rem;font-weight:800;color:#0D1B3E;margin:0 0 10px;}
.auth-sub{font-size:.88rem;color:#6B7280;margin:0 0 28px;line-height:1.65;}
.btn-submit{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:#F97316;color:#fff;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 4px 14px rgba(249,115,22,.35);transition:background .2s,transform .1s;}
.btn-submit:hover{background:#EA6C0A;transform:translateY(-1px);color:#fff;text-decoration:none;}
</style>
<div class="auth-bg">
  <div class="auth-card">
    <a href="/" class="brand">
      <div class="brand-icon"><i class="fas fa-truck"></i></div>
      <div class="brand-name">RiftValley Carriers</div>
    </a>
    <div class="success-circle"><i class="fas fa-check"></i></div>
    <h1 class="auth-title">Password updated!</h1>
    <p class="auth-sub">Your password has been successfully reset. You can now sign in with your new password.</p>
    <a href="/sign_in/" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Sign In Now</a>
  </div>
</div>
{% endblock %}
