{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div>
        <div class="card-body">
          <h2 class="card-title">Reset Password</h2>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Reset My Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
