{% extends "base.html" %}
{% block title %}
Reset Your password
{% endblock  %}

{% block content %}
{% if validlink %}
<p>please enter your new password.</p>
<form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p><input type="submit" value="change my password"></p>
</form>
{% else %}
<p>The password reset was invalid.</p>

{% endif %}
{% endblock  %}
