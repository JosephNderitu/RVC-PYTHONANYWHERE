{% extends "courier/base.html" %}
{% load static %}

{% block head %}
<script src="{% static 'js/webcam-easy.min.js' %}"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    background: #000;
    overflow: hidden;
  }

  /* ── Camera view ── */
  #take-photo-step {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ── Preview view ── */
  #upload-step {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ── Top back button ── */
  .btn-back {
    position: fixed;
    top: 16px; left: 16px;
    z-index: 500;
    display: flex; align-items: center; gap: 6px;
    background: rgba(15,17,23,0.75);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 8px 14px;
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    backdrop-filter: blur(8px);
    transition: background 0.15s;
  }
  .btn-back:hover { background: rgba(26,29,39,0.9); color: #fff; text-decoration: none; }

  /* ── Status label floating top-center ── */
  .status-label {
    position: fixed;
    top: 16px;
    left: 50%; transform: translateX(-50%);
    z-index: 500;
    background: rgba(15,17,23,0.75);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 6px 16px;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }

  /* ── Bottom action buttons ── */
  .bottom-actions {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 500;
    padding: 20px 24px 36px;
    background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  /* Shutter button */
  .shutter-btn {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .shutter-btn:active { transform: scale(0.93); }
  .shutter-inner {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ddd;
  }

  /* Secondary buttons */
  .action-btn {
    padding: 12px 24px;
    border-radius: 14px;
    border: none;
    font-size: 0.88rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s;
    text-decoration: none;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-retake  { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  .btn-upload  { background: #3B82F6; color: #fff; }
  .action-btn:hover { opacity: 0.9; }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Upload state */
  .uploading .btn-upload { background: #22263A; }
  .spinner-sm {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error toast */
  #error-toast {
    position: fixed;
    top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 600;
    background: rgba(239,68,68,0.9);
    color: #fff;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 0.84rem;
    font-family: 'Inter', sans-serif;
    display: none;
    white-space: nowrap;
    backdrop-filter: blur(8px);
  }
</style>
{% endblock %}

{% block content %}

<!-- Back button -->
<a href="{% url 'courier:current_job' %}" class="btn-back">
  <i class="fas fa-chevron-left" style="font-size:12px;"></i>
  Back
</a>

<!-- Status label -->
<div class="status-label">
  {% if job.status == 'picking' %}
    <i class="fas fa-box" style="margin-right:5px;color:#10B981;"></i>Pickup Photo
  {% else %}
    <i class="fas fa-flag-checkered" style="margin-right:5px;color:#3B82F6;"></i>Delivery Photo
  {% endif %}
</div>

<!-- Error toast -->
<div id="error-toast"></div>

<!-- Camera view -->
<div id="take-photo-step">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas" class="d-none"></canvas>
  <div class="bottom-actions">
    <button class="shutter-btn" onclick="take_photo()">
      <div class="shutter-inner"></div>
    </button>
  </div>
</div>

<!-- Preview + upload view -->
<div id="upload-step">
  <img id="photo" alt="Preview" />
  <div class="bottom-actions">
    <button class="action-btn btn-retake" onclick="retake_photo()">
      <i class="fas fa-redo" style="font-size:13px;"></i> Retake
    </button>
    <button class="action-btn btn-upload" id="upload-btn" onclick="upload_photo()">
      <i class="fas fa-cloud-upload-alt" style="font-size:13px;"></i>
      Upload Photo
    </button>
  </div>
</div>

<script>
var webcamElement = document.getElementById('webcam');
var canvasElement = document.getElementById('canvas');
var webcam = new Webcam(webcamElement, 'environment', canvasElement);
webcam.start()
  .catch(function(err) {
    showError('Camera access denied: ' + err.message);
  });

function take_photo() {
  var picture = webcam.snap();
  document.getElementById('photo').src = picture;
  document.getElementById('take-photo-step').style.display = 'none';
  document.getElementById('upload-step').style.display = 'flex';
}

function retake_photo() {
  document.getElementById('upload-step').style.display = 'none';
  document.getElementById('take-photo-step').style.display = 'flex';
}

function getCookie(name) {
  var value = '; ' + document.cookie;
  var parts = value.split('; ' + name + '=');
  if (parts.length === 2) return parts.pop().split(';').shift();
  return '';
}

function showError(msg) {
  var toast = document.getElementById('error-toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(function() { toast.style.display = 'none'; }, 5000);
}

function setUploading(loading) {
  var btn = document.getElementById('upload-btn');
  if (loading) {
    btn.innerHTML = '<div class="spinner-sm"></div> Uploading…';
    btn.disabled = true;
  } else {
    btn.innerHTML = '<i class="fas fa-cloud-upload-alt" style="font-size:13px;"></i> Upload Photo';
    btn.disabled = false;
  }
}

function upload_photo() {
  setUploading(true);

  canvasElement.toBlob(function(blob) {
    if (!blob) {
      showError('Failed to process photo. Please retake.');
      setUploading(false);
      return;
    }

    var uploadName = "{% if job.status == 'picking' %}pickup{% else %}delivery{% endif %}_photo";
    var updateUrl  = "{% url 'courier:current_job_update_api' job.id %}";
    var csrfToken  = getCookie('csrftoken');
    var jobId      = "{{ job.id }}";
    var photoType  = "{% if job.status == 'picking' %}pickup{% else %}delivery{% endif %}";

    /* ── OFFLINE: queue photo to IndexedDB ── */
    if (!navigator.onLine) {
      var reader = new FileReader();
      reader.onloadend = function() {
        RvcDB.savePhoto(jobId, photoType, reader.result, updateUrl, csrfToken)
          .then(function() {
            setUploading(false);
            if (window.Swal) {
              Swal.fire({
                toast: true, position: 'bottom', icon: 'warning',
                title: "You're offline — photo queued",
                text:  'It will upload automatically when you reconnect.',
                showConfirmButton: false,
                timer: 5000, timerProgressBar: true,
              });
            }
            setTimeout(function() {
              window.location.href = "{% url 'courier:current_job' %}";
            }, 2500);
          })
          .catch(function(err) {
            showError('Failed to queue photo: ' + err.message);
            setUploading(false);
          });
      };
      reader.readAsDataURL(blob);
      return;
    }

    /* ── ONLINE: normal upload ── */
    var formdata = new FormData();
    formdata.append(uploadName, blob, uploadName + '.png');

    fetch(updateUrl, {
      method:      'POST',
      headers:     { 'X-CSRFToken': csrfToken },
      credentials: 'same-origin',
      body:        formdata,
    })
    .then(function(response) {
      if (!response.ok) {
        return response.text().then(function(text) {
          throw new Error('Server error ' + response.status + ': ' + text.substring(0, 100));
        });
      }
      return response.json();
    })
    .then(function(json) {
      if (json.success) {
        {% if job.status == 'picking' %}
          window.location.href = "{% url 'courier:current_job' %}";
        {% else %}
          window.location.href = "{% url 'courier:job_complete' %}";
        {% endif %}
      } else {
        showError(json.error || 'Upload failed. Please try again.');
        setUploading(false);
      }
    })
    .catch(function(err) {
      showError('Upload failed: ' + err.message);
      setUploading(false);
    });

  }, 'image/png');
}

/* Phase 4 — flush queued photos when connection returns */
window.addEventListener('online', function() {
  if (window.RvcOffline && window.RvcOffline.flushPhotoQueue) {
    window.RvcOffline.flushPhotoQueue();
  }
});
 
/* Show queued-photos badge on load */
if (window.RvcOffline && window.RvcOffline.updatePhotoSyncBadge) {
  document.addEventListener('DOMContentLoaded', function() {
    window.RvcOffline.updatePhotoSyncBadge();
  });
}
/* Phase 4 — flush queued photos on reconnect */
window.addEventListener('online', function() {
  if (window.RvcOffline && window.RvcOffline.flushPhotoQueue) {
    window.RvcOffline.flushPhotoQueue();
  }
});
</script>
{% endblock %}
