{% url "courier:available_jobs" as available_jobs_url %}
{% url "courier:current_job" as current_job_url %}
{% url "courier:archived_jobs" as archived_jobs_url %}
{% url "courier:profile" as profile_url %}

<style>
.btab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--tab-h, 64px);
  z-index: 300;
  background: rgba(26,29,39,0.98);
  border-top: 1px solid #2E3352;
  display: flex;
  align-items: stretch;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.btab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: #4B5563;
  text-decoration: none !important;
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.btab-item i { font-size: 19px; transition: color 0.15s; }
.btab-item.active,
.btab-item:hover { color: #3B82F6; }
.btab-item.active i { color: #3B82F6; }

/* Active indicator bar */
.btab-item.active::before {
  content: '';
  position: absolute;
  top: 0; left: 20%; right: 20%;
  height: 2px;
  background: #3B82F6;
  border-radius: 0 0 2px 2px;
}

/* Hide on desktop — desktop nav is built into each page */
@media (min-width: 768px) {
  .btab-bar { display: none; }
}
</style>

<nav class="btab-bar">
  <a href="{{ available_jobs_url }}"
     class="btab-item {% if request.path == available_jobs_url %}active{% endif %}">
    <i class="fas fa-map-marked-alt"></i>
    <span>Jobs</span>
  </a>
  <a href="{{ current_job_url }}"
     class="btab-item {% if request.path == current_job_url %}active{% endif %}">
    <i class="fas fa-truck"></i>
    <span>My Job</span>
  </a>
  <a href="{{ archived_jobs_url }}"
     class="btab-item {% if request.path == archived_jobs_url %}active{% endif %}">
    <i class="fas fa-history"></i>
    <span>History</span>
  </a>
  <a href="{{ profile_url }}"
     class="btab-item {% if request.path == profile_url %}active{% endif %}">
    <i class="fas fa-user-circle"></i>
    <span>Profile</span>
  </a>
</nav>
